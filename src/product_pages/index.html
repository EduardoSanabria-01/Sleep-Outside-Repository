<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Outside | Product Details</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="divider" id="main-header"></header>
  <main class="divider">
    <section class="product-detail">
      <!-- Los detalles del producto se cargan aquí con JavaScript -->
      <h3 id="productName"></h3>
      <h2 class="divider" id="productNameWithoutBrand"></h2>
      <img
        class="divider"
        id="product-image"
        src=""
        alt=""
      />
      <p class="product-card__price" id="productCard__price"></p>
      <p class="product__color" id="product-colorName"></p>
      <p class="product__description" id="product-description"></p>
      <div class="product-detail__add">
        <button id="addToCart" data-id="">Add to Cart</button>
      </div>
    </section>
  </main>
  <footer id="main-footer"></footer>
  
  <!-- Coloca el script aquí al final para que el DOM ya exista -->
  <script src="../js/product.js" type="module"></script>
</body>
</html>
